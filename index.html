<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root[data-theme=cyberpunk]{color-scheme:dark;--bg:#0A0A0C;--surface:#121215;--band:#0D0D10;--line:#26262C;--line-2:#4D4A33;--ink:#F1EEDC;--ink-2:#C2BDA3;--ink-3:#918C74;--accent:#F7E018;--on-accent:#0A0A0C;--accent-soft:#2D2A0A;--accent-text:#F7E018;--ok:#0A0A0C;--ok-soft:#F7E018;--wait:#FF6170;--wait-soft:#3A0F16;--bad:#FF6170;--control:#17171B;--sans:'Chakra Petch',system-ui,sans-serif;--r:0px;--r-s:0px;--r-l:0px;--r-pill:0px}

:root[data-theme=everforest]{color-scheme:dark;--bg:#232A2E;--surface:#2D353B;--band:#272E33;--line:#3D484D;--line-2:#4F585E;--ink:#D3C6AA;--ink-2:#BDB8A0;--ink-3:#9DA9A0;--accent:#A7C080;--on-accent:#2D353B;--accent-soft:#3C4841;--accent-text:#A7C080;--ok:#7FBBB3;--ok-soft:#32424B;--wait:#DBBC7F;--wait-soft:#4D4C43;--bad:#E67E80;--control:#343F44;--r:6px;--r-s:5px;--r-l:8px}

body{margin:0;min-height:100vh;box-sizing:border-box;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}

#deck,#settings{display:flex;flex-direction:column;gap:20px}#settings{max-width:856px;margin:0 auto;gap:24px}
[hidden]{display:none!important}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}

.menu{position:fixed;z-index:6;min-width:220px;box-sizing:border-box;padding:4px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.18)}

.key{font:500 13px var(--mono)}.type{font-size:12px;color:var(--ink-3)}
.dot{flex:none;width:7px;height:7px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--ink-3)}.dot.live{background:var(--ink-3)}
.name{min-width:0;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}

.none{margin:0;font-size:12.5px;color:var(--ink-3)}

.eh button svg{flex:none}.eh button[aria-expanded=false] svg{transform:rotate(-90deg)}
.eh .badge{padding:2px 8px;border-radius:var(--r-s);background:var(--ink);color:var(--surface);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

.eh .key{font-size:12.5px}.eh .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.board .eh{margin-top:18px;padding:0 0 4px;gap:6px 10px;background:transparent;border-top:0;border-bottom:3px solid var(--ink)}
.board .eh button{padding:0 6px 0 2px}.board .eh .et{font-size:15px}
.table{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--surface)}
.table>div{min-width:1116px}
.r{display:grid;grid-template-columns:var(--cols);column-gap:20px;align-items:center;padding:12px 20px}
.r.head{padding:10px 20px}
.r.t{border-top:1px solid var(--line-2)}
.r.t .title{font-size:14.5px;font-weight:600;line-height:1.35;text-wrap:pretty}
.r.t .prs{display:flex;flex-direction:column;gap:6px;min-width:0}.r.t .pr .d{flex-basis:100%}
.r.t select{width:100%}.r .acts>*{flex:1}.r .acts>.more{flex:none}
.r.s{padding:4px 20px;background:var(--band);border-top:1px solid var(--line)}
.r.s .who{display:flex;align-items:center;gap:8px;min-width:0;padding-left:18px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:24px;align-items:start}
.board section{min-width:0}.colh{display:flex;align-items:center;gap:10px}.colh h2{margin:0}.colh span{font-size:12.5px;color:var(--ink-3)}
.card{margin-top:12px;border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.card .top{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.35;text-wrap:pretty}
.card .prs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:2px}
.bs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 16px;background:var(--band);border-top:1px solid var(--line)}
.bs>div:first-child{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:1px}
.bs .who{display:flex;align-items:center;gap:8px}.bs .meta{padding-left:15px;font-size:11.5px}
.card .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;border-top:1px solid var(--line)}
.list{border:1px solid var(--line-2);border-radius:var(--r-l);overflow:hidden;margin-top:12px}.list .bs:first-child{border-top:0}
details>summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2)}details>.body{margin-top:12px}
.banner{border:1px solid var(--bad);color:var(--bad);border-radius:var(--r-l);padding:8px 12px;background:var(--surface)}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:13px;font-weight:500}
.sec{display:flex;flex-direction:column;gap:10px}
.box{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-l)}.box>*+*{border-top:1px solid var(--line)}
.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:14px 20px}
.srow .tx{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow h3,.srow .h{margin:0;font-size:14.5px;font-weight:600}.srow p{margin:0;font-size:13px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px;padding:16px 20px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px}
.tcard{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;padding:10px;text-align:left;white-space:normal;border:2px solid var(--line);border-radius:var(--r-l);font-weight:400;text-transform:none!important;letter-spacing:normal!important}
.tcard[aria-pressed=true]{border-color:var(--accent)}
.tcard b{font-size:14px;font-weight:600}.tcard em{font-style:normal;font-size:12px;font-weight:500;color:var(--accent-text)}.tcard small{font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.switch{flex:none;width:46px;height:28px;min-height:28px;padding:3px;border-radius:999px;background:var(--band);justify-content:flex-start}
.switch[aria-checked=true]{background:var(--accent);justify-content:flex-end}
.switch i{width:20px;height:20px;border-radius:50%;background:var(--ink-3)}.switch[aria-checked=true] i{background:var(--on-accent)}
@media (pointer:coarse){button,select,a.btn{min-height:44px}}
</style></head><body><main>
<div id="deck">
<header>
<div><h1>Ticket Command Deck</h1><span id="picker"></span><span id="sub" class="sub"></span></div>
<div class="lbl" style="gap:12px"><span id="upd" class="upd" role="status"></span><button id="refresh" type="button">Refresh</button><a class="btn" href="#settings">Settings</a></div>
</header>
<div class="bar">
<div class="lbl">Group by <span id="groupby"></span></div>
<div class="lbl">Open in <span id="openin"></span></div>
<label class="lbl">Default repo <select id="defcwd"></select></label>
</div>
<div id="errors"></div>
<div id="active"></div>
<details id="todo-d"><summary id="todo-s">To do</summary><div id="todo" class="body"></div></details>
<details><summary id="unl-s">Unlinked sessions</summary><p class="none">Type /ticket KEY in a session to link it.</p><div id="unlinked"></div></details>
</div>
<div id="settings" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.flat(Infinity).filter((k) => k != null && k !== false));
  return e;
};
const svg = (markup) => { const t = document.createElement('template'); t.innerHTML = markup; return t.content.firstChild; };
const ICON = {
  dots: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>',
  down: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5 7 9l3.5-3.5"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3 4.5 7l4 4"/></svg>',
};
const base = (p) => p.split('/').filter(Boolean).pop() || p;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  for (const [n, u] of [[86400, 'd'], [3600, 'h'], [60, 'm']]) if (s >= n) return Math.floor(s / n) + u + ' ago';
  return 'just now';
};
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} applyTheme(); render(); };
const applyTheme = () => { const t = pref('theme', 'default'); document.documentElement.dataset.theme = THEMES.some((x) => x.id === t) && t !== 'default' ? t : pref('mode', 'system'); };

let data = null;
const overrides = new Map();
const hasTerminal = () => !data || data.terminal;
const target = () => (hasTerminal() && pref('target', 'app') === 'terminal' ? 'terminal' : 'app');
const otherTarget = () => (target() === 'app' ? 'terminal' : 'app');
const targetName = { terminal: 'terminal', app: 'Claude app' };

const boards = () => { try { return JSON.parse(pref('boards', '[]')); } catch { return []; } };
let boardId = (() => { try { return sessionStorage.getItem('board'); } catch { return null; } })() ?? pref('firstBoard', '');
const board = () => boards().find((b) => b.id === boardId) ?? null;
const typeLabel = (b) => ({ scrum: 'Sprint', kanban: 'Kanban' })[b.type] ?? 'Board';
const boardMeta = (b, withProject) => [withProject && b.projectKey, typeLabel(b), b.qf?.length ? plural(b.qf.length, 'filter') + ' from link' : null].filter(Boolean).join(' · ');
function selectBoard(id) {
  boardId = id;
  try { sessionStorage.setItem('board', id); } catch {}
  closePop(); data = null; render(); load();
}
function addBoard(b, typed) {
  let url = b.url, qf = [];
  try {
    const u = new URL(typed);
    if (/^https?:$/.test(u.protocol)) { url = u.href; qf = u.searchParams.getAll('quickFilter').filter((v) => /^\d+$/.test(v)); }
  } catch {}
  const list = boards().filter((x) => x.id !== b.id);
  if (!list.length && !pref('firstBoard', '')) try { localStorage.setItem('firstBoard', b.id); } catch {}
  setPref('boards', JSON.stringify([...list, { id: b.id, name: b.name, type: b.type, projectKey: b.projectKey, url, qf }]));
}
function removeBoard(id) {
  if (pref('firstBoard', '') === id) try { localStorage.setItem('firstBoard', ''); } catch {}
  setPref('boards', JSON.stringify(boards().filter((b) => b.id !== id)));
  if (boardId === id) selectBoard('');
}

function boardSearch(placeholder, onPick) {
  const input = el('input', { type: 'search', placeholder, ariaLabel: placeholder });
  const found = el('div', { className: 'found' });
  let timer = 0, seq = 0;
  input.oninput = () => {
    clearTimeout(timer);
    const q = input.value.trim(), mine = ++seq;
    if (!q) return found.replaceChildren();
    timer = setTimeout(async () => {
      found.replaceChildren(el('p', { className: 'none' }, 'Searching Jira…'));
      try {
        const r = await fetch('/api/boards?q=' + encodeURIComponent(q));
        const list = await r.json();
        if (mine !== seq) return;
        if (!r.ok) throw new Error(list.error);
        const loaded = new Set(boards().map((b) => b.id));
        found.replaceChildren(...(list.length ? list.map((b) => {
          const btn = el('button', { type: 'button', className: 'item' },
            el('span', { className: 'tx' }, el('span', {}, b.name), el('small', {}, boardMeta(b, true))),
            el('small', {}, loaded.has(b.id) ? 'Loaded' : 'Load'));
          btn.onclick = () => onPick(b, q);
          return btn;
        }) : [el('p', { className: 'none' }, 'No boards match.')]));
      } catch (e) {
        if (mine === seq) found.replaceChildren(el('p', { className: 'none' }, 'Board search failed: ' + e.message));
      }
    }, 300);

let pop = null, popFor = null;
function closePop() { pop?.remove(); pop = popFor = null; }
// Popovers live on <body> with fixed position because the table and cards clip their overflow.
function openPop(anchor, node, side) {
  closePop();
  pop = node; popFor = anchor;
  document.body.append(node);
  const r = anchor.getBoundingClientRect();
  node.style.top = r.bottom + 4 + 'px';
  if (side === 'left') node.style.left = r.left + 'px';
  else node.style.right = document.documentElement.clientWidth - r.right + 'px';
  node.querySelector('input,button')?.focus();
}
const togglePop = (anchor, make, side) => (popFor === anchor ? closePop() : openPop(anchor, make(), side));
document.addEventListener('click', (e) => { if (pop && !pop.contains(e.target) && !popFor.contains(e.target)) closePop(); });

window.addEventListener('scroll', (e) => { if (pop && !pop.contains(e.target)) closePop(); }, true);

function seg(label, current, options, onPick) {

    b.onclick = () => onPick(value);
    return b;
  }));
}

], (v) => setPref('target', v));

async function post(path, body, btn) {
  const old = btn.textContent; btn.disabled = true;
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    btn.textContent = r.ok ? 'Opened' : (await r.json()).error;
  } catch { btn.textContent = 'Failed'; }
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2000);
}
function flash(btn, text) {
  const old = btn.textContent; btn.textContent = text;
  setTimeout(() => (btn.textContent = old), 1500);
}
const go = (url) => { location.href = url; };
const resumeIn = {
  terminal: (s, btn) => post('/api/resume', { sessionId: s.id }, btn),
  app: (s) => go('claude://resume?session=' + s.id),

const statusTone = (t) => /review/i.test(t.status) ? 'wait' : t.statusCategory === 'indeterminate' ? 'accent' : '';
function prInfo(p) {
  if (p.state !== 'OPEN') return { state: p.state === 'MERGED' ? 'Merged' : 'Closed', tone: '', detail: '' };
  const r = p.reviews, changes = p.reviewDecision === 'CHANGES_REQUESTED' || r.changesRequested > 0;
  const failed = p.checks === 'FAILURE' || p.checks === 'ERROR';
  const review = changes ? 'Changes requested' : r.approved ? plural(r.approved, 'approval')
    : p.reviewRequests ? plural(p.reviewRequests, 'review') + ' requested' : 'No reviews yet';
  const checks = p.checks === 'SUCCESS' ? 'checks passed' : failed ? 'checks failed' : p.checks ? 'checks running' : null;
  const threads = p.unresolved ? plural(p.unresolved, 'unresolved comment') : null;
  return {
    state: p.isDraft ? 'Draft' : 'Open',
    tone: p.isDraft ? '' : r.approved && !changes && !failed && !threads ? 'ok' : 'wait',
    detail: [review, threads, checks].filter(Boolean).join(' · '),
  };
}
function prNode(p) {
  const i = prInfo(p);
  return el('div', { className: 'pr' },
    el('a', { href: p.url, target: '_blank', rel: 'noopener', title: p.title }, `${base(p.repo)}#${p.number}`),
    el('span', { className: 'pill s ' + i.tone }, i.state),
    i.detail ? el('span', { className: 'd' }, i.detail) : null);
}
const prNodes = (t) => t.prs.length ? t.prs.map(prNode) : [el('span', { className: 'none' }, 'No pull request yet')];
const grouped = () => pref('group', 'epic') === 'epic';
const keyLine = (t) => el('div', { className: 'kl' },
  el('a', { className: 'key', href: t.url, target: '_blank', rel: 'noopener' }, t.key), el('span', { className: 'type' }, t.type),

  !grouped() && t.epic ? el('span', { className: 'ep', title: t.epic.title }, '· ' + t.epic.title) : null);

const closedEpics = () => { try { return new Set(JSON.parse(pref('closedEpics', '[]'))); } catch { return new Set(); } };
function toggleEpic(id) {
  const closed = closedEpics();

}
const byProgress = (tickets) => [...tickets].sort((a, b) => (a.statusCategory === 'new') - (b.statusCategory === 'new'));
// An epic assigned to you leads its own group only when the list has children for it; otherwise it is an ordinary row in "Other tickets".
function epicGroups(tickets) {
  const withChildren = new Set(tickets.map((t) => t.epic?.key).filter(Boolean));
  const groups = new Map();
  for (const t of tickets) {
    const own = t.isEpic && withChildren.has(t.key);
    const epic = own ? { key: t.key, title: t.summary, url: t.url } : t.epic;
    const id = epic?.key ?? '';
    if (!groups.has(id)) groups.set(id, { id, epic, tickets: [] });
    own ? groups.get(id).tickets.unshift(t) : groups.get(id).tickets.push(t);
  }
  const other = groups.get('');
  groups.delete('');
  return [...groups.values(), ...(other ? [other] : [])];
}
function epicHead(g, count) {
  const b = el('button', { type: 'button' }, svg(ICON.chev), g.epic ? el('span', { className: 'badge' }, 'Epic') : null,
    el('span', { className: 'et' }, g.epic ? g.epic.title : 'Other tickets'));
  b.setAttribute('aria-expanded', String(!closedEpics().has(g.id)));
  b.onclick = () => toggleEpic(g.id);
  return el('div', { className: 'eh' }, b,
    g.epic ? el('a', { className: 'key', href: g.epic.url, target: '_blank', rel: 'noopener' }, g.epic.key) : null,
    count == null ? null : el('span', { className: 'cnt' }, plural(count, 'ticket')));
}
const inGroups = (tickets, each, count) => epicGroups(tickets).flatMap((g) =>
  [epicHead(g, count ? g.tickets.length : null), ...(closedEpics().has(g.id) ? [] : g.tickets.flatMap(each))]);

const dot = (s) => el('span', { className: 'dot' + (s.live ? ' live' : ''), ariaHidden: 'true' });

function defaultCwd() {
  const saved = pref('defaultCwd', '');
  if (data.cwds.includes(saved)) return saved;
  const latest = data.tickets.flatMap((t) => t.sessions).sort((a, b) => (b.lastActive ?? '').localeCompare(a.lastActive ?? ''))[0];
  return data.cwds.includes(latest?.cwd) ? latest.cwd : data.cwds[0];
}

function renderDeck() {

let loads = 0;
function busy(on) {
  const b = $('refresh');
  b.disabled = on;
  b.setAttribute('aria-busy', String(on));
  b.replaceChildren(...(on ? [el('span', { className: 'spin', ariaHidden: 'true' }), 'Refreshing…'] : ['Refresh']));
  if (on) $('upd').textContent = data ? 'Updating…' : 'Loading tickets, pull requests and sessions…';
}
async function load(fresh) {
  busy(++loads > 0);
  const want = boardId, b = board(), qs = new URLSearchParams();
  if (fresh === true) qs.set('fresh', '1');
  if (b) { qs.set('board', b.id); if (b.qf?.length) qs.set('qf', b.qf.join(',')); }
  try {
    const d = await (await fetch('/api/deck?' + qs)).json();
    if (want !== boardId) return;
    data = d;
    $('errors').replaceChildren(...data.errors.map((e) => el('div', { className: 'banner' }, e)));
    render();
    $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('errors').replaceChildren(el('div', { className: 'banner' }, 'Deck failed: ' + e.message));
    $('upd').textContent = 'Update failed';
  } finally {
    busy(--loads > 0);
  }
}
$('refresh').onclick = () => load(true);
window.addEventListener('hashchange', render);
applyTheme(); render(); load(); setInterval(() => pop || document.activeElement?.matches('input') || load(), 60000);
