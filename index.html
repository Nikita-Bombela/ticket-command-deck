body{margin:0;min-height:100vh;box-sizing:border-box;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
main{max-width:1400px;margin:0 auto;padding:28px 32px 40px;box-sizing:border-box}
#deck,#settings{display:flex;flex-direction:column;gap:20px}#settings{max-width:856px;margin:0 auto;gap:24px}
[hidden]{display:none!important}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
header>div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--ink-2)}
.upd{font:400 12.5px var(--mono);color:var(--ink-3)}
button,select,a.btn{box-sizing:border-box;min-height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--control);color:var(--ink);font:500 13px var(--sans);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
select{font-weight:400;padding:0 10px;min-width:0}
button:hover,a.btn:hover{border-color:var(--ink-3);text-decoration:none}
button:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:84px;box-sizing:border-box;padding:8px 12px;resize:vertical;border:1px solid var(--line-2);border-radius:var(--r);background:var(--control);color:var(--ink);font:400 13px/1.5 var(--sans)}
.preview{margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--band);font-size:13px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}.preview b{font-weight:500;color:var(--ink-3)}
input[type=search]{width:100%;min-height:36px;box-sizing:border-box;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--control);color:var(--ink);font:400 13px var(--sans)}
.sm{min-height:30px;padding:0 10px;border-radius:var(--r-s);background:transparent;color:var(--ink-2);font-size:12.5px}
.sm.primary{color:var(--accent-text);padding:0 12px}
.sm.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--band)}
.seg button{min-height:30px;padding:0 12px;border:0;border-radius:var(--r-s);background:transparent;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
#refresh{gap:8px}
.spin{width:12px;height:12px;box-sizing:border-box;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
.cap{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tag{padding:1px 7px;border-radius:var(--r-pill);font-size:11.5px;background:var(--line);color:var(--ink-2);text-transform:none;letter-spacing:normal}
.picker{gap:8px;padding:0 10px 0 12px}
select.quiet{min-height:30px;padding:0;border:0;background:transparent;color:var(--ink-2);font:400 12.5px var(--mono)}
.more{flex:none;width:32px;padding:0}
.menu{position:fixed;z-index:6;min-width:220px;box-sizing:border-box;padding:4px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.18)}
.menu button{min-height:32px;padding:0 10px;border:0;border-radius:var(--r-s);background:transparent;font-weight:400;justify-content:flex-start;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--band)}
.menu.boards{width:340px;max-width:calc(100vw - 64px);padding:8px;gap:6px}
.menu.boards .cap{padding:4px 6px 0}
.menu .manage{margin-top:2px;padding:8px 8px 4px;border-top:1px solid var(--line);font-size:13px;font-weight:500}
.item{gap:8px;min-height:42px!important;padding:4px 8px!important;font-weight:500!important;white-space:normal}
.item[aria-checked=true]{background:var(--band)}
.item .tx{flex:1;display:flex;flex-direction:column;text-transform:none;letter-spacing:normal}
.item small{font-size:12px;font-weight:400;color:var(--ink-3)}
.item svg,.item .gap{flex:none;width:14px}
.found{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto}
.found button{border:0;background:transparent;justify-content:flex-start}
.found button:hover{background:var(--band)}
.pill{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--line);color:var(--ink-2)}
.pill.s{padding:1px 8px;font-size:12px}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}.pill.wait{background:var(--wait-soft);color:var(--wait)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.key{font:500 13px var(--mono)}.type{font-size:12px;color:var(--ink-3)}
.dot{flex:none;width:7px;height:7px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--ink-3)}.dot.live{background:var(--ink-3)}
.name{min-width:0;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.meta{font:400 12px var(--mono);color:var(--ink-3);overflow-wrap:anywhere}
.none{margin:0;font-size:12.5px;color:var(--ink-3)}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}.pr a{font:500 12.5px var(--mono)}.pr .d{font-size:12px;color:var(--ink-2)}
.acts{display:flex;gap:6px}
.kl{display:flex;align-items:baseline;gap:8px;min-width:0}.kl .ep{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--ink-3)}
.eh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 20px 6px 12px;background:var(--surface);border-top:3px solid var(--ink)}
.eh button{gap:10px;padding:0 8px;border:0;border-radius:var(--r-s);background:transparent;text-align:left;white-space:normal;text-transform:none!important;letter-spacing:normal!important}
.eh button svg{flex:none}.eh button[aria-expanded=false] svg{transform:rotate(-90deg)}
.eh .badge{padding:2px 8px;border-radius:var(--r-s);background:var(--ink);color:var(--surface);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.eh .et{font-size:16px;font-weight:600;letter-spacing:-.005em}
.eh .key{font-size:12.5px}.eh .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.board .eh{margin-top:18px;padding:0 0 4px;gap:6px 10px;background:transparent;border-top:0;border-bottom:3px solid var(--ink)}
.board .eh button{padding:0 6px 0 2px}.board .eh .et{font-size:15px}
.table{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--surface)}
.table>div{min-width:1116px}
.r{display:grid;grid-template-columns:var(--cols);column-gap:20px;align-items:center;padding:12px 20px}
.r.head{padding:10px 20px}
.r.t{border-top:1px solid var(--line-2)}
.r.t .title{font-size:14.5px;font-weight:600;line-height:1.35;text-wrap:pretty}
.r.t .prs{display:flex;flex-direction:column;gap:6px;min-width:0}.r.t .pr .d{flex-basis:100%}
.r.t select{width:100%}.r .acts>*{flex:1}.r .acts>.more{flex:none}
.r.s{padding:4px 20px;background:var(--band);border-top:1px solid var(--line)}
.r.s .who{display:flex;align-items:center;gap:8px;min-width:0;padding-left:18px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:24px;align-items:start}

</style></head><body><main>

<header>
<div><svg class="crest" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#F5A04A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 29 26 8"/><path d="M26 29 8 8"/><path d="M19 4.5c5 .5 9.5 4.5 10.5 10"/><path d="M15 4.5c-5 .5-9.5 4.5-10.5 10"/></svg><h1>Ticket Command Deck</h1><span id="picker"></span><span id="sub" class="sub"></span></div>
<div class="lbl" style="gap:12px"><span id="upd" class="upd" role="status"></span><button id="refresh" type="button">Refresh</button><a class="btn" href="#settings">Settings</a></div>
</header>
<div class="bar">

</div>

</div>

</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.flat(Infinity).filter((k) => k != null && k !== false));
  return e;
};
const svg = (markup) => { const t = document.createElement('template'); t.innerHTML = markup; return t.content.firstChild; };
const ICON = {
  dots: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>',
  down: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5 7 9l3.5-3.5"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3 4.5 7l4 4"/></svg>',
};
const base = (p) => p.split('/').filter(Boolean).pop() || p;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  for (const [n, u] of [[86400, 'd'], [3600, 'h'], [60, 'm']]) if (s >= n) return Math.floor(s / n) + u + ' ago';
  return 'just now';
};
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} applyTheme(); render(); };
const applyTheme = () => { const t = pref('theme', 'default'); document.documentElement.dataset.theme = THEMES.some((x) => x.id === t) && t !== 'default' ? t : pref('mode', 'system'); };

let data = null;
const overrides = new Map();
const hasTerminal = () => !data || data.terminal;
const target = () => (hasTerminal() && pref('target', 'app') === 'terminal' ? 'terminal' : 'app');
const otherTarget = () => (target() === 'app' ? 'terminal' : 'app');
const targetName = { terminal: 'terminal', app: 'Claude app' };

const boards = () => { try { return JSON.parse(pref('boards', '[]')); } catch { return []; } };
let boardId = (() => { try { return sessionStorage.getItem('board'); } catch { return null; } })() ?? pref('firstBoard', '');
const board = () => boards().find((b) => b.id === boardId) ?? null;
const typeLabel = (b) => ({ scrum: 'Sprint', kanban: 'Kanban' })[b.type] ?? 'Board';
const boardMeta = (b, withProject) => [withProject && b.projectKey, typeLabel(b), b.qf?.length ? plural(b.qf.length, 'filter') + ' from link' : null].filter(Boolean).join(' · ');
function selectBoard(id) {
  boardId = id;
  try { sessionStorage.setItem('board', id); } catch {}
  closePop(); data = null; render(); load();
}
function addBoard(b, typed) {
  let url = b.url, qf = [];
  try {
    const u = new URL(typed);
    if (/^https?:$/.test(u.protocol)) { url = u.href; qf = u.searchParams.getAll('quickFilter').filter((v) => /^\d+$/.test(v)); }
  } catch {}
  const list = boards().filter((x) => x.id !== b.id);
  if (!list.length && !pref('firstBoard', '')) try { localStorage.setItem('firstBoard', b.id); } catch {}
  setPref('boards', JSON.stringify([...list, { id: b.id, name: b.name, type: b.type, projectKey: b.projectKey, url, qf }]));
}
function removeBoard(id) {
  if (pref('firstBoard', '') === id) try { localStorage.setItem('firstBoard', ''); } catch {}
  setPref('boards', JSON.stringify(boards().filter((b) => b.id !== id)));
  if (boardId === id) selectBoard('');
}

function boardSearch(placeholder, onPick) {
  const input = el('input', { type: 'search', placeholder, ariaLabel: placeholder });
  const found = el('div', { className: 'found' });
  let timer = 0, seq = 0;
  input.oninput = () => {
    clearTimeout(timer);
    const q = input.value.trim(), mine = ++seq;
    if (!q) return found.replaceChildren();
    timer = setTimeout(async () => {
      found.replaceChildren(el('p', { className: 'none' }, 'Searching Jira…'));
      try {
        const r = await fetch('/api/boards?q=' + encodeURIComponent(q));
        const list = await r.json();
        if (mine !== seq) return;
        if (!r.ok) throw new Error(list.error);
        const loaded = new Set(boards().map((b) => b.id));
        found.replaceChildren(...(list.length ? list.map((b) => {
          const btn = el('button', { type: 'button', className: 'item' },
            el('span', { className: 'tx' }, el('span', {}, b.name), el('small', {}, boardMeta(b, true))),
            el('small', {}, loaded.has(b.id) ? 'Loaded' : 'Load'));
          btn.onclick = () => onPick(b, q);
          return btn;
        }) : [el('p', { className: 'none' }, 'No boards match.')]));
      } catch (e) {
        if (mine === seq) found.replaceChildren(el('p', { className: 'none' }, 'Board search failed: ' + e.message));
      }
    }, 300);
  };
  return { input, found };
}

let pop = null, popFor = null;
function closePop() { pop?.remove(); pop = popFor = null; }
// Popovers live on <body> with fixed position because the table and cards clip their overflow.
function openPop(anchor, node, side) {
  closePop();
  pop = node; popFor = anchor;
  document.body.append(node);
  const r = anchor.getBoundingClientRect();
  node.style.top = r.bottom + 4 + 'px';
  if (side === 'left') node.style.left = r.left + 'px';
  else node.style.right = document.documentElement.clientWidth - r.right + 'px';
  node.querySelector('input,button')?.focus();
}
const togglePop = (anchor, make, side) => (popFor === anchor ? closePop() : openPop(anchor, make(), side));
document.addEventListener('click', (e) => { if (pop && !pop.contains(e.target) && !popFor.contains(e.target)) closePop(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });
window.addEventListener('scroll', (e) => { if (pop && !pop.contains(e.target)) closePop(); }, true);

function seg(label, current, options, onPick) {
  return el('span', { className: 'seg', role: 'group', ariaLabel: label }, options.map(([value, text, off]) => {
    const b = el('button', { type: 'button', disabled: !!off, title: off || '' }, text);
    b.setAttribute('aria-pressed', String(current === value));
    b.onclick = () => onPick(value);
    return b;
  }));
}
const prsSeg = () => seg('Pull requests to show', pref('prs', 'mine'), [['mine', 'Mine'], ['all', 'All']], (v) => { setPref('prs', v); load(); });
const openInSeg = () => seg('Open sessions in', target(), [
  ['app', 'Claude app'], ['terminal', 'Terminal', hasTerminal() ? '' : 'WezTerm was not found on this computer'],
], (v) => setPref('target', v));

async function post(path, body, btn) {
  const old = btn.textContent; btn.disabled = true;
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    btn.textContent = r.ok ? 'Opened' : (await r.json()).error;
  } catch { btn.textContent = 'Failed'; }
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2000);
}
function flash(btn, text) {
  const old = btn.textContent; btn.textContent = text;
  setTimeout(() => (btn.textContent = old), 1500);
}
const go = (url) => { location.href = url; };
const resumeIn = {
  terminal: (s, btn) => post('/api/resume', { sessionId: s.id }, btn),
  app: (s) => go('claude://resume?session=' + s.id),
};

const statusTone = (t) => /review/i.test(t.status) ? 'wait' : t.statusCategory === 'indeterminate' ? 'accent' : '';
function prInfo(p) {
  if (p.state !== 'OPEN') return { state: p.state === 'MERGED' ? 'Merged' : 'Closed', tone: '', detail: '' };
  const r = p.reviews, changes = p.reviewDecision === 'CHANGES_REQUESTED' || r.changesRequested > 0;
  const failed = p.checks === 'FAILURE' || p.checks === 'ERROR';
  const review = changes ? 'Changes requested' : r.approved ? plural(r.approved, 'approval')
    : p.reviewRequests ? plural(p.reviewRequests, 'review') + ' requested' : 'No reviews yet';
  const checks = p.checks === 'SUCCESS' ? 'checks passed' : failed ? 'checks failed' : p.checks ? 'checks running' : null;
  const threads = p.unresolved ? plural(p.unresolved, 'unresolved comment') : null;
  return {
    state: p.isDraft ? 'Draft' : 'Open',
    tone: p.isDraft ? '' : r.approved && !changes && !failed && !threads ? 'ok' : 'wait',
    detail: [review, threads, checks].filter(Boolean).join(' · '),
  };
}
function prNode(p) {
  const i = prInfo(p);
  return el('div', { className: 'pr' },
    el('a', { href: p.url, target: '_blank', rel: 'noopener', title: p.title }, `${base(p.repo)}#${p.number}`),
    el('span', { className: 'pill s ' + i.tone }, i.state),
    p.mine === false && p.author ? el('span', { className: 'type' }, 'by ' + p.author) : null,
    i.detail ? el('span', { className: 'd' }, i.detail) : null);

const prNodes = (t) => t.prs.length ? t.prs.map(prNode) : [el('span', { className: 'none' }, 'No pull request yet')];
const grouped = () => pref('group', 'epic') === 'epic';
const keyLine = (t) => el('div', { className: 'kl' },
  el('a', { className: 'key', href: t.url, target: '_blank', rel: 'noopener' }, t.key), el('span', { className: 'type' }, t.type),
  t.parent ? el('span', { className: 'ep', title: t.parent.title }, '· sub-task of ' + t.parent.key) : null,
  !grouped() && t.epic ? el('span', { className: 'ep', title: t.epic.title }, '· ' + t.epic.title) : null);

const closedEpics = () => { try { return new Set(JSON.parse(pref('closedEpics', '[]'))); } catch { return new Set(); } };

  const closed = closedEpics();
  closed.has(id) ? closed.delete(id) : closed.add(id);
  setPref('closedEpics', JSON.stringify([...closed]));
}
const byProgress = (tickets) => [...tickets].sort((a, b) => (a.statusCategory === 'new') - (b.statusCategory === 'new'));
// An epic assigned to you leads its own group only when the list has children for it; otherwise it is an ordinary row in "Other tickets".
function epicGroups(tickets) {
  const withChildren = new Set(tickets.map((t) => t.epic?.key).filter(Boolean));
  const groups = new Map();
  for (const t of tickets) {
    const own = t.isEpic && withChildren.has(t.key);
    const epic = own ? { key: t.key, title: t.summary, url: t.url } : t.epic;
    const id = epic?.key ?? '';
    if (!groups.has(id)) groups.set(id, { id, epic, tickets: [] });
    own ? groups.get(id).tickets.unshift(t) : groups.get(id).tickets.push(t);
  }
  const other = groups.get('');
  groups.delete('');
  return [...groups.values(), ...(other ? [other] : [])];
}
function epicHead(g, count) {
  const b = el('button', { type: 'button' }, svg(ICON.chev), g.epic ? el('span', { className: 'badge' }, 'Epic') : null,
    el('span', { className: 'et' }, g.epic ? g.epic.title : 'Other tickets'));
  b.setAttribute('aria-expanded', String(!closedEpics().has(g.id)));
  b.onclick = () => toggleEpic(g.id);
  return el('div', { className: 'eh' }, b,
    g.epic ? el('a', { className: 'key', href: g.epic.url, target: '_blank', rel: 'noopener' }, g.epic.key) : null,
    count == null ? null : el('span', { className: 'cnt' }, plural(count, 'ticket')));
}
const inGroups = (tickets, each, count) => epicGroups(tickets).flatMap((g) =>
  [epicHead(g, count ? g.tickets.length : null), ...(closedEpics().has(g.id) ? [] : g.tickets.flatMap(each))]);

function sessionActions(s) {
  const resume = el('button', { type: 'button', className: 'sm primary', title: 'Resume in the ' + targetName[target()] }, 'Resume');
  resume.onclick = () => resumeIn[target()](s, resume);
  const more = el('button', { type: 'button', className: 'sm more', ariaLabel: 'More actions', ariaHasPopup: 'menu' }, svg(ICON.dots));
  const items = () => [
    ['Copy resume command', () => navigator.clipboard.writeText(`cd '${s.cwd.replace(/'/g, "'\\''")}' && claude --resume ${s.id}`).then(() => flash(resume, 'Copied'), () => flash(resume, 'Copy failed'))],
    (otherTarget() === 'app' || hasTerminal()) && [`Open in ${targetName[otherTarget()]} instead`, () => resumeIn[otherTarget()](s, resume)],
  ].filter(Boolean);
  more.onclick = () => togglePop(more, () => el('div', { className: 'menu', role: 'menu' }, items().map(([label, fn]) => {
    const b = el('button', { type: 'button', role: 'menuitem' }, label);
    b.onclick = () => { closePop(); fn(); };
    return b;
  })));

}
const dot = (s) => el('span', { className: 'dot' + (s.live ? ' live' : ''), ariaHidden: 'true' });
const liveText = (s) => s.live ? s.live.status.charAt(0).toUpperCase() + s.live.status.slice(1) : '';
const branch = (s) => s.branches.at(-1) ?? '';

function defaultCwd() {
  const saved = pref('defaultCwd', '');
  if (data.cwds.includes(saved)) return saved;
  const latest = data.tickets.flatMap((t) => t.sessions).sort((a, b) => (b.lastActive ?? '').localeCompare(a.lastActive ?? ''))[0];
  return data.cwds.includes(latest?.cwd) ? latest.cwd : data.cwds[0];
}
const cwdOptions = () => data.cwds.map((c) => el('option', { value: c, title: c }, base(c)));
function defaultCwdSelect(node) {
  node.replaceChildren(...(data ? cwdOptions() : []));
  node.disabled = !data;
  if (data) node.value = defaultCwd();
  node.onchange = () => setPref('defaultCwd', node.value);
  return node;
}

const DEFAULT_START = 'This line is a marker for the Ticket Command Deck, so no action is needed. Reply "Linked" and wait for my next message.';
// The first sentence is fixed because the deck links an app session to its ticket by it.
function startMessage(t) {
  const body = pref('startMessage', DEFAULT_START).replace(/\{(key|summary|url)\}/g, (_, k) => t[k]).trim();
  return body ? `Link this session to Jira ticket ${t.key}. ${body}` : '';
}
function appStartUrl(t, folder) {
  const q = startMessage(t);
  return 'claude://code/new?' + new URLSearchParams(q ? { folder, q } : { folder });
}

function newControls(t) {
  const sel = el('select', { className: 'quiet', ariaLabel: 'Repo for this ticket' }, cwdOptions());
  sel.value = overrides.get(t.key) ?? (pref('reuse', '1') === '1' ? t.sessions[0]?.cwd : null) ?? defaultCwd();
  if (!sel.value) sel.value = defaultCwd();
  sel.onchange = () => overrides.set(t.key, sel.value);
  const start = el('button', { type: 'button', title: 'Start a session in the ' + targetName[target()] }, 'Start session');
  start.onclick = () => target() === 'terminal'
    ? post('/api/new', { key: t.key, cwd: sel.value }, start)
    : go(appStartUrl(t, sel.value));
  return { sel, start };
}

function tableView(tickets, byEpic) {
  const head = el('div', { className: 'r head cap' }, ...['Ticket · Session', 'Status', 'Pull requests · Branch', 'Repo', 'Start · Resume'].map((h) => el('span', {}, h)));
  const ticketRows = (t) => {
    const n = newControls(t);
    return [
      el('div', { className: 'r t' },
        el('div', {}, keyLine(t), el('div', { className: 'title' }, t.summary)),
        el('div', {}, el('span', { className: 'pill ' + statusTone(t) }, t.status)),
        el('div', { className: 'prs' }, prNodes(t)),
        n.sel,
        el('div', { className: 'acts' }, n.start)),
      ...t.sessions.map((s) => el('div', { className: 'r s' },
        el('div', { className: 'who' }, dot(s), el('span', { className: 'name' }, s.title)),
        el('div', { className: 'type' }, liveText(s)),
        el('div', { className: 'meta' }, `${branch(s)} · ${ago(s.lastActive)}`),
        el('div', { className: 'meta', title: s.cwd }, base(s.cwd)),
        sessionActions(s))),
    ];
  };
  return el('div', { className: 'table' }, el('div', {}, head, byEpic ? inGroups(tickets, ticketRows, true) : tickets.flatMap(ticketRows)));
}

const sessionBand = (s) => el('div', { className: 'bs' },
  el('div', {},
    el('div', { className: 'who' }, dot(s), el('span', { className: 'name' }, s.title)),
    el('div', { className: 'meta', title: s.cwd }, [liveText(s), branch(s), base(s.cwd), ago(s.lastActive)].filter(Boolean).join(' · '))),
  sessionActions(s));

function columnsView(tickets, byEpic) {
  const card = (t) => {
    const n = newControls(t);
    return el('div', { className: 'card' },
      el('div', { className: 'top' }, keyLine(t), el('h3', {}, t.summary), el('div', { className: 'prs' }, prNodes(t))),
      t.sessions.map(sessionBand),
      el('div', { className: 'foot' }, n.sel, n.start));
  };
  const cols = new Map();

function renderDeck() {
  const b = board();
  const picker = el('button', { type: 'button', className: 'picker', ariaHasPopup: 'menu' },
    el('span', {}, b ? b.name : 'All my tickets'), b ? el('span', { className: 'tag' }, typeLabel(b)) : null, svg(ICON.down));
  picker.onclick = () => togglePop(picker, boardMenu, 'left');
  $('picker').replaceChildren(picker);
  const byEpic = grouped();
  $('groupby').replaceChildren(seg('Group tickets by', byEpic ? 'epic' : 'none', [['epic', 'Epic'], ['none', 'None']], (v) => setPref('group', v)));
  $('prsmode').replaceChildren(prsSeg());
  $('openin').replaceChildren(openInSeg());
  defaultCwdSelect($('defcwd'));
  if (!data) { $('sub').textContent = 'Loading…'; return; }
  const draw = pref('view', 'rows') === 'board' ? columnsView : tableView;
  const active = data.tickets.filter((t) => t.statusCategory !== 'new');
  const todo = data.tickets.filter((t) => t.statusCategory === 'new');
  const sprint = data.board?.sprint, days = sprint?.endDate ? Math.ceil((new Date(sprint.endDate) - Date.now()) / 864e5) : null;
  $('sub').textContent = [sprint?.name, days == null ? null : days > 0 ? plural(days, 'day') + ' left' : 'sprint ended', `${active.length} in progress`].filter(Boolean).join(' · ');
  const shown = byEpic ? byProgress(data.tickets) : active;
  $('active').replaceChildren(shown.length ? draw(shown, byEpic) : el('p', { className: 'none' }, data.jiraSetup ? 'Your tickets appear here once Jira is connected.' : b ? 'No open tickets for you on this board.' : 'No open tickets.'));
  $('todo-d').hidden = byEpic || !todo.length;
  $('todo-s').textContent = `To do · ${plural(todo.length, 'ticket')}`;
  $('todo').replaceChildren(byEpic ? '' : draw(todo, false));
  const cutoff = Date.now() - 14 * 864e5;
  const un = data.unlinked.filter((s) => new Date(s.lastActive) > cutoff);
  $('unl-s').textContent = `Unlinked sessions · ${un.length}`;
  $('unlinked').replaceChildren(un.length ? el('div', { className: 'list' }, un.map(sessionBand)) : '');
}

const JIRA_LINES = 'JIRA_BASE=https://your-company.atlassian.net\nJIRA_EMAIL=you@your-company.com\nJIRA_TOKEN=your-api-token';
function jiraSetupCard(problem) {
  const tokens = () => el('a', { href: 'https://id.atlassian.com/manage-profile/security/api-tokens', target: '_blank', rel: 'noopener' }, 'Atlassian API tokens page');
  const code = (text) => {
    const copy = el('button', { type: 'button', className: 'sm' }, 'Copy');
    copy.onclick = () => navigator.clipboard.writeText(text).then(() => flash(copy, 'Copied'), () => flash(copy, 'Copy failed'));
    return el('div', { className: 'code' }, el('pre', {}, text), copy);
  };
  const refresh = ['Select Refresh. You do not need to restart the deck.'];
  const cases = {
    'no-file': ['The deck reads your Jira login from the file ~/.jira-env, and that file does not exist on this computer.', [
      ['Create a Jira API token on the ', tokens(), '.'],
      ['Run this command in a terminal, with your own Jira address, email and token in it:', code(`printf '${JIRA_LINES.replace(/\n/g, '\\n')}\\n' > ~/.jira-env && chmod 600 ~/.jira-env`)],
      refresh]],
    missing: [`The file ~/.jira-env exists, but it has no value for ${(problem.missing ?? []).join(', ')}.`, [
      ['Open ~/.jira-env in an editor and make sure it has these three lines, with your own values:', code(JIRA_LINES)],
      ['If you have no token yet, create one on the ', tokens(), '.'],
      refresh]],
    unreadable: ['The file ~/.jira-env exists, but the deck is not allowed to read it.', [
      ['Run this command in a terminal:', code('chmod 600 ~/.jira-env')],
      refresh]],
    auth: ['Jira rejected the email and token in ~/.jira-env. Usually the token has expired or was revoked, or JIRA_EMAIL is not the email of your Atlassian account.', [
      ['Create a new token on the ', tokens(), '.'],
      ['Replace the value of JIRA_TOKEN in ~/.jira-env, and check JIRA_EMAIL.'],
      refresh]],
    unreachable: [`The deck could not reach Jira at ${problem.base}.`, [
      ['Check that JIRA_BASE in ~/.jira-env is your Jira address, for example https://your-company.atlassian.net.'],
      ['Check your internet connection or VPN.'],
      refresh]],
  };
  const [why, steps] = cases[problem.code] ?? ['The deck could not read your Jira login.', [refresh]];
  return el('div', { className: 'setup', role: 'alert' },
    el('h2', {}, "Jira is not connected, so the deck can't show your tickets"),
    el('p', {}, why),
    el('ol', {}, steps.map((st) => el('li', {}, st))),
    el('p', { className: 'none' }, 'Your Claude sessions are still listed under Unlinked sessions.'));
}

let loads = 0;
function busy(on) {
  const b = $('refresh');
  b.disabled = on;
  b.setAttribute('aria-busy', String(on));
  b.replaceChildren(...(on ? [el('span', { className: 'spin', ariaHidden: 'true' }), 'Refreshing…'] : ['Refresh']));
  if (on) $('upd').textContent = data ? 'Updating…' : 'Loading tickets, pull requests and sessions…';
}
async function load(fresh) {
  busy(++loads > 0);
  const want = boardId, b = board(), qs = new URLSearchParams();
  if (fresh === true) qs.set('fresh', '1');
  if (pref('prs', 'mine') === 'all') qs.set('prs', 'all');
  if (b) { qs.set('board', b.id); if (b.qf?.length) qs.set('qf', b.qf.join(',')); }
  try {
    const d = await (await fetch('/api/deck?' + qs)).json();
    if (want !== boardId) return;
    data = d;
    $('errors').replaceChildren(...(data.jiraSetup ? [jiraSetupCard(data.jiraSetup)] : []), ...data.errors.map((e) => el('div', { className: 'banner' }, e)));
    render();
    $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('errors').replaceChildren(el('div', { className: 'banner' }, 'Deck failed: ' + e.message));
    $('upd').textContent = 'Update failed';
  } finally {
    busy(--loads > 0);
  }
}
$('refresh').onclick = () => load(true);
window.addEventListener('hashchange', render);
applyTheme(); render(); load(); setInterval(() => pop || document.activeElement?.matches('input,textarea') || load(), 60000);
